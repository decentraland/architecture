<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decentraland Repo Dependency Graph</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b21;
    --panel-border: #2a2e37;
    --text: #e6e8eb;
    --text-dim: #9aa0aa;
    --accent: #4E79A7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { display: flex; height: 100vh; width: 100vw; }
  #sidebar {
    width: 300px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    padding: 16px; overflow-y: auto;
  }
  #main { flex: 1; position: relative; }
  #network { width: 100%; height: 100%; background: var(--bg); }
  h1 {
    font-size: 15px; margin: 0 0 4px 0; color: var(--text);
    font-weight: 600;
  }
  .subtitle { font-size: 11px; color: var(--text-dim); margin-bottom: 16px; }
  .section { margin-bottom: 18px; }
  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); margin-bottom: 8px; font-weight: 600;
  }
  #search {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--panel-border); background: #0d0f13; color: var(--text);
    font-size: 13px;
  }
  #search:focus { outline: 1px solid var(--accent); }
  .lang-list { max-height: 260px; overflow-y: auto; }
  .lang-item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 2px; font-size: 12.5px; cursor: pointer; user-select: none;
    border-radius: 4px;
  }
  .lang-item:hover { background: #1f232b; }
  .lang-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .lang-count { margin-left: auto; color: var(--text-dim); font-size: 11px; }
  .lang-controls { display: flex; gap: 8px; margin-bottom: 8px; }
  .lang-controls button {
    flex: 1; font-size: 11px; padding: 4px 6px; border-radius: 4px;
    border: 1px solid var(--panel-border); background: #21252d; color: var(--text);
    cursor: pointer;
  }
  .lang-controls button:hover { background: #2a2f39; }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  #counter {
    position: absolute; top: 14px; right: 16px;
    background: rgba(24,27,33,0.9); border: 1px solid var(--panel-border);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    color: var(--text); z-index: 10;
  }
  #legend {
    position: absolute; bottom: 14px; left: 16px;
    background: rgba(24,27,33,0.9); border: 1px solid var(--panel-border);
    padding: 10px 14px; border-radius: 8px; font-size: 11.5px;
    max-width: 260px; z-index: 10;
  }
  #legend-title { font-weight: 600; margin-bottom: 6px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px;}
  #legend-items { display: flex; flex-wrap: wrap; gap: 5px 12px; }
  .legend-entry { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  #node-info {
    font-size: 12.5px; color: var(--text-dim); line-height: 1.5;
    background: #0d0f13; border: 1px solid var(--panel-border); border-radius: 6px;
    padding: 10px; min-height: 40px;
  }
  #node-info b { color: var(--text); }
  .orphan-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .orphan-count-badge {
    font-size: 10.5px; color: var(--text-dim); background: #0d0f13;
    border: 1px solid var(--panel-border); border-radius: 10px; padding: 1px 8px;
  }
  #orphan-copy {
    margin-left: auto; font-size: 11px; padding: 3px 9px; border-radius: 5px;
    border: 1px solid var(--panel-border); background: #21252d; color: var(--text);
    cursor: pointer;
  }
  #orphan-copy:hover { background: #2a2f39; }
  #orphan-copy.copied { border-color: #59A14F; color: #8fd39a; }
  #orphan-list {
    max-height: 320px; overflow-y: auto; font-size: 12.5px; color: var(--text-dim);
    background: #0d0f13; border: 1px solid var(--panel-border); border-radius: 6px; padding: 4px 4px;
  }
  .orphan-group + .orphan-group { margin-top: 6px; }
  .orphan-group-title {
    display: flex; align-items: center; gap: 6px; padding: 4px 6px 3px 6px;
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
    color: var(--text-dim); position: sticky; top: 0; background: #0d0f13; z-index: 1;
  }
  .orphan-group-title .lang-swatch { width: 8px; height: 8px; }
  .orphan-row {
    display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 4px;
    color: var(--text); cursor: pointer; user-select: none;
  }
  .orphan-row:hover { background: #1f232b; }
  .orphan-row:hover .orphan-name { text-decoration: underline; }
  .orphan-row:focus-visible { outline: 1px solid var(--accent); background: #1f232b; }
  .orphan-row.selected { background: #24303f; box-shadow: inset 2px 0 0 var(--accent); }
  .orphan-row .lang-swatch { width: 8px; height: 8px; flex-shrink: 0; }
  .orphan-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .orphan-fork-badge {
    font-size: 9.5px; color: var(--text-dim); background: #21252d; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 0 6px; flex-shrink: 0;
  }
  .orphan-ext-link {
    flex-shrink: 0; color: var(--text-dim); text-decoration: none; font-size: 12px;
    padding: 0 2px; border-radius: 3px; line-height: 1;
  }
  .orphan-ext-link:hover { color: var(--text); background: #2a2f39; }
  .orphan-empty { padding: 10px 6px; font-size: 12px; color: var(--text-dim); font-style: italic; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #333844; border-radius: 4px; }
  div.vis-tooltip {
    background: var(--panel) !important; color: var(--text) !important;
    border: 1px solid var(--panel-border) !important; border-radius: 6px !important;
    padding: 5px 9px !important; font-size: 12.5px !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Decentraland Repo Dependency Graph</h1>
    <div class="subtitle">Non-archived repos &middot; edges = dependent &rarr; dependency</div>

    <div class="section">
      <div class="section-title">Search</div>
      <input id="search" type="text" placeholder="Filter by repo name substring&hellip;" />
    </div>

    <div class="section">
      <div class="section-title">Language</div>
      <div class="lang-controls">
        <button id="lang-all">All</button>
        <button id="lang-none">None</button>
      </div>
      <div class="lang-list" id="lang-list"></div>
    </div>

    <div class="section">
      <div class="toggle-row">
        <input type="checkbox" id="orphan-toggle" checked />
        <label for="orphan-toggle">Show orphan repos (degree 0)</label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Selected node</div>
      <div id="node-info">Click a node to see details.</div>
    </div>

    <div class="section">
      <div class="section-title">Orphan repos</div>
      <div class="orphan-toolbar">
        <span class="orphan-count-badge" id="orphan-count">60 total</span>
        <button id="orphan-copy" title="Copy visible repo names to clipboard">Copy list</button>
      </div>
      <div id="orphan-list"></div>
    </div>
  </div>
  <div id="main">
    <div id="counter">- repos / - edges</div>
    <div id="network"></div>
    <div id="legend">
      <div id="legend-title">Language legend</div>
      <div id="legend-items"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const allNodes = DATA.nodes;
  const allEdges = DATA.edges;
  const langColor = DATA.langColor;
  const languages = DATA.languages;
  const orphanSet = new Set(DATA.orphans);

  // degree -> size scale
  const degrees = allNodes.map(n => n.degree);
  const maxDegree = Math.max(1, ...degrees);
  function sizeForDegree(d) {
    const MIN = 10, MAX = 55;
    return MIN + (MAX - MIN) * Math.sqrt(d / maxDegree);
  }

  const nodesDataset = new vis.DataSet(allNodes.map(n => ({
    id: n.id,
    label: n.label,
    title: n.id + (n.fork ? ' (fork)' : ''),
    language: n.language,
    degree: n.degree,
    fork: n.fork,
    color: {
      background: langColor[n.language] || '#888',
      border: '#1a1c20',
      highlight: { background: langColor[n.language] || '#888', border: '#fff' },
      hover: { background: langColor[n.language] || '#888', border: '#fff' }
    },
    font: { color: '#e6e8eb', size: 12, face: 'Segoe UI, Arial' },
    size: sizeForDegree(n.degree),
    shape: 'dot'
  })));

  const edgesDataset = new vis.DataSet(allEdges.map((e, i) => ({
    id: i,
    from: e.from,
    to: e.to,
    arrows: 'to',
    color: { color: '#3d4250', highlight: '#ffffff', hover: '#7a8194', opacity: 0.6 },
    width: 1,
    smooth: { type: 'dynamic' }
  })));

  const container = document.getElementById('network');
  const network = new vis.Network(container, { nodes: nodesDataset, edges: edgesDataset }, {
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -60, springLength: 90, springConstant: 0.06, damping: 0.4, avoidOverlap: 0.6 },
      stabilization: { iterations: 200 }
    },
    interaction: { hover: true, tooltipDelay: 150 },
    nodes: { borderWidth: 1.5 },
    edges: { selectionWidth: 2 }
  });

  // ---- filter state ----
  const state = {
    search: '',
    activeLanguages: new Set(languages),
    showOrphans: true,
    selectedNode: null
  };

  function nodePassesFilter(n) {
    if (!state.activeLanguages.has(n.language)) return false;
    if (!state.showOrphans && orphanSet.has(n.id)) return false;
    if (state.search && !n.id.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  }

  function applyFilters() {
    const visibleIds = new Set();
    const updates = [];
    for (const n of allNodes) {
      const visible = nodePassesFilter(n);
      if (visible) visibleIds.add(n.id);
      updates.push({ id: n.id, hidden: !visible });
    }
    nodesDataset.update(updates);

    let edgeCount = 0;
    const edgeUpdates = [];
    allEdges.forEach((e, i) => {
      const visible = visibleIds.has(e.from) && visibleIds.has(e.to);
      if (visible) edgeCount++;
      edgeUpdates.push({ id: i, hidden: !visible });
    });
    edgesDataset.update(edgeUpdates);

    document.getElementById('counter').textContent = visibleIds.size + ' repos / ' + edgeCount + ' edges';

    // re-apply highlight if a node is selected and still visible
    if (state.selectedNode && visibleIds.has(state.selectedNode)) {
      highlightNode(state.selectedNode);
    } else if (state.selectedNode) {
      clearHighlight();
    }
  }

  // ---- highlight on click ----
  function clearHighlight() {
    state.selectedNode = null;
    const updates = allNodes.filter(n => !nodesDataset.get(n.id).hidden || true).map(n => ({
      id: n.id,
      opacity: 1
    }));
    nodesDataset.update(allNodes.map(n => ({ id: n.id, opacity: 1 })));
    edgesDataset.update(allEdges.map((e, i) => ({ id: i, opacity: 0.6 })));
  }

  function highlightNode(nodeId) {
    state.selectedNode = nodeId;
    const connectedNodeIds = new Set([nodeId]);
    const connectedEdgeIds = new Set();
    allEdges.forEach((e, i) => {
      if (e.from === nodeId || e.to === nodeId) {
        connectedNodeIds.add(e.from);
        connectedNodeIds.add(e.to);
        connectedEdgeIds.add(i);
      }
    });
    nodesDataset.update(allNodes.map(n => ({
      id: n.id,
      opacity: connectedNodeIds.has(n.id) ? 1 : 0.12
    })));
    edgesDataset.update(allEdges.map((e, i) => ({
      id: i,
      opacity: connectedEdgeIds.has(i) ? 1 : 0.05
    })));
  }

  function showNodeInfo(nodeId) {
    const n = allNodes.find(x => x.id === nodeId);
    if (!n) return;
    const outgoing = allEdges.filter(e => e.from === nodeId).map(e => e.to);
    const incoming = allEdges.filter(e => e.to === nodeId).map(e => e.from);
    document.getElementById('node-info').innerHTML =
      '<b>' + n.id + '</b><br/>' +
      'Language: ' + n.language + '<br/>' +
      'Degree: ' + n.degree + (n.fork ? ' (fork)' : '') + '<br/>' +
      'Depends on (' + outgoing.length + '): ' + (outgoing.length ? outgoing.join(', ') : '&mdash;') + '<br/>' +
      'Depended on by (' + incoming.length + '): ' + (incoming.length ? incoming.join(', ') : '&mdash;');
  }

  function clearSelection() {
    clearHighlight();
    network.unselectAll();
    document.getElementById('node-info').textContent = 'Click a node to see details.';
    markSelectedOrphanRow(null);
  }

  function selectNode(nodeId, opts) {
    opts = opts || {};
    highlightNode(nodeId);
    showNodeInfo(nodeId);
    markSelectedOrphanRow(nodeId);
    if (nodesDataset.get(nodeId) && !nodesDataset.get(nodeId).hidden) {
      network.selectNodes([nodeId]);
      if (opts.focus !== false) {
        network.focus(nodeId, { scale: 1.1, animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
      }
    }
  }

  network.on('click', function(params) {
    if (params.nodes && params.nodes.length > 0) {
      selectNode(params.nodes[0], { focus: false });
    } else {
      clearSelection();
    }
  });

  // ---- search box ----
  document.getElementById('search').addEventListener('input', function(e) {
    state.search = e.target.value.trim();
    applyFilters();
    renderOrphanList();
  });

  // ---- language checkboxes ----
  const langListEl = document.getElementById('lang-list');
  languages.forEach(lang => {
    const count = allNodes.filter(n => n.language === lang).length;
    const row = document.createElement('label');
    row.className = 'lang-item';
    row.innerHTML =
      '<input type="checkbox" checked data-lang="' + lang + '" />' +
      '<span class="lang-swatch" style="background:' + (langColor[lang] || '#888') + '"></span>' +
      '<span>' + lang + '</span>' +
      '<span class="lang-count">' + count + '</span>';
    langListEl.appendChild(row);
  });
  langListEl.addEventListener('change', function(e) {
    if (e.target.matches('input[type=checkbox]')) {
      const lang = e.target.getAttribute('data-lang');
      if (e.target.checked) state.activeLanguages.add(lang);
      else state.activeLanguages.delete(lang);
      applyFilters();
    }
  });
  document.getElementById('lang-all').addEventListener('click', function() {
    state.activeLanguages = new Set(languages);
    langListEl.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = true);
    applyFilters();
  });
  document.getElementById('lang-none').addEventListener('click', function() {
    state.activeLanguages = new Set();
    langListEl.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    applyFilters();
  });

  // ---- orphan toggle ----
  document.getElementById('orphan-toggle').addEventListener('change', function(e) {
    state.showOrphans = e.target.checked;
    applyFilters();
  });

  // ---- legend ----
  const legendItemsEl = document.getElementById('legend-items');
  languages.forEach(lang => {
    const entry = document.createElement('div');
    entry.className = 'legend-entry';
    entry.innerHTML =
      '<span class="legend-swatch" style="background:' + (langColor[lang] || '#888') + '"></span>' +
      '<span>' + lang + '</span>';
    legendItemsEl.appendChild(entry);
  });

  // ---- orphan list panel ----
  const orphanListEl = document.getElementById('orphan-list');
  const orphanCountEl = document.getElementById('orphan-count');
  const orphanCopyBtn = document.getElementById('orphan-copy');
  const nodeById = new Map(allNodes.map(n => [n.id, n]));
  const totalOrphans = DATA.orphans.length;

  function renderOrphanList() {
    const term = state.search.toLowerCase();
    const visible = DATA.orphans.filter(name => !term || name.toLowerCase().includes(term));

    orphanListEl.innerHTML = '';
    if (!visible.length) {
      const empty = document.createElement('div');
      empty.className = 'orphan-empty';
      empty.textContent = 'No orphan repos match "' + state.search + '".';
      orphanListEl.appendChild(empty);
    } else {
      // group by language, groups sorted alphabetically, repos alphabetical within group
      const byLang = new Map();
      visible.forEach(name => {
        const n = nodeById.get(name);
        const lang = (n && n.language) || 'Unknown';
        if (!byLang.has(lang)) byLang.set(lang, []);
        byLang.get(lang).push(name);
      });
      const sortedLangs = Array.from(byLang.keys()).sort((a, b) => a.localeCompare(b));
      sortedLangs.forEach(lang => {
        const names = byLang.get(lang).sort((a, b) => a.localeCompare(b));
        const group = document.createElement('div');
        group.className = 'orphan-group';

        const title = document.createElement('div');
        title.className = 'orphan-group-title';
        title.innerHTML =
          '<span class="lang-swatch" style="background:' + (langColor[lang] || '#888') + '"></span>' +
          '<span>' + lang + '</span><span style="margin-left:auto;font-weight:400;">' + names.length + '</span>';
        group.appendChild(title);

        names.forEach(name => {
          const n = nodeById.get(name);
          const row = document.createElement('div');
          row.className = 'orphan-row';
          row.dataset.repo = name;
          row.tabIndex = 0;
          row.setAttribute('role', 'button');
          row.title = 'Select ' + name + ' in the graph';
          row.innerHTML =
            '<span class="lang-swatch" style="background:' + (langColor[lang] || '#888') + '"></span>' +
            '<span class="orphan-name">' + name + '</span>' +
            (n && n.fork ? '<span class="orphan-fork-badge">fork</span>' : '') +
            '<a class="orphan-ext-link" href="https://github.com/decentraland/' + encodeURIComponent(name) +
              '" target="_blank" rel="noopener noreferrer" title="Open decentraland/' + name + ' on GitHub">&#8599;</a>';
          group.appendChild(row);
        });

        orphanListEl.appendChild(group);
      });
    }

    orphanCountEl.textContent = (state.search ? visible.length + ' / ' + totalOrphans : totalOrphans + ' total');
    markSelectedOrphanRow(state.selectedNode);
  }

  function markSelectedOrphanRow(nodeId) {
    orphanListEl.querySelectorAll('.orphan-row').forEach(el => {
      el.classList.toggle('selected', !!nodeId && el.dataset.repo === nodeId);
    });
  }

  orphanListEl.addEventListener('click', function(e) {
    if (e.target.closest('.orphan-ext-link')) return;
    const row = e.target.closest('.orphan-row');
    if (!row) return;
    selectNode(row.dataset.repo);
  });
  orphanListEl.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('.orphan-row');
    if (!row) return;
    e.preventDefault();
    selectNode(row.dataset.repo);
  });

  orphanCopyBtn.addEventListener('click', function() {
    const term = state.search.toLowerCase();
    const visible = DATA.orphans.filter(name => !term || name.toLowerCase().includes(term));
    const text = visible.slice().sort((a, b) => a.localeCompare(b)).join('\n');
    navigator.clipboard.writeText(text).then(function() {
      orphanCopyBtn.textContent = 'Copied!';
      orphanCopyBtn.classList.add('copied');
      setTimeout(function() {
        orphanCopyBtn.textContent = 'Copy list';
        orphanCopyBtn.classList.remove('copied');
      }, 1500);
    });
  });

  renderOrphanList();

  // initial counter
  applyFilters();
})();
</script>
</body>
</html>
